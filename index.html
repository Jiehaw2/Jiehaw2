
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JieHaw2</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            max-width: 700px;
        }

        h1 {
            font-size: 70px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #666;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .links a {
            text-decoration: none;
            color: white;
            background: #111;
            padding: 15px 25px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .links a:hover {
            transform: translateY(-3px);
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="content">
            <h1>JieHaw2</h1>

            <p>
                Welcome to my world.
                Follow me on social media.
            </p>

            <div class="links">
                <a href="#">YouTube</a>
                <a href="#">Facebook</a>
                <a href="#">TikTok</a>
            </div>
        </div>
    </section>

</body>
</html>
